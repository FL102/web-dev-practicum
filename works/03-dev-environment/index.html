<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ковалева Анастасия — практическая работа 3</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --text: #1f1d1a;
      --muted: #6b665d;
      --accent: #2f5d50;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    main { max-width: 640px; width: 100%; }
    .label {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 14px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(36px, 8vw, 64px);
      line-height: 1.05;
    }
    p { margin: 0 0 8px; color: var(--muted); font-size: 18px; line-height: 1.5; }
    footer { margin-top: 32px; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <p class="label">Практическая работа 3</p>
    <h1>Ковалева Анастасия</h1>
    <p>Настройка среды веб-разработки: VS Code, Live Server, Git, GitHub Pages, ngrok и Postman.</p>
    <footer id="info"></footer>
  </main>
  <script>
    // Show where the page is served from: Live Server, ngrok or GitHub Pages
    document.getElementById('info').textContent =
      'Адрес страницы: ' + location.href;
  </script>
</body>
</html>
